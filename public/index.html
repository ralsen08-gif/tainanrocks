<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #dde2e6;   /* board */
    --paper: #f6f7f5;    /* controls */
    --ink: #1e232a;
    --muted: #66707b;
    --rule: #a9b2bb;
    --cell: 58px;
    --gap: 7px;
    --edge: 32px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ground); color: var(--ink);
    font-family: 'Archivo', system-ui, sans-serif; font-variation-settings: 'wdth' 100; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* top: title on the left, view switcher on the right */
  .top { position: fixed; top: 28px; left: var(--edge); right: var(--edge); display: flex; gap: 20px 32px;
    justify-content: space-between; align-items: flex-start; flex-wrap: wrap; pointer-events: none; }
  .title { max-width: min(56ch, 60vw); }
  .title h1 { margin: 0; font-size: clamp(22px, 2.6vw, 38px); line-height: 1.05; font-weight: 750;
    font-variation-settings: 'wdth' 125; letter-spacing: -0.01em; }
  .title p { margin: 10px 0 0; font-size: clamp(14px, 1.15vw, 18px); line-height: 1.4; color: var(--muted); }
  .title p.error { color: #b3261e; }

  .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; pointer-events: auto; }
  .views { display: flex; padding: 3px; gap: 2px; background: var(--paper); border: 1px solid var(--rule); border-radius: 7px; }
  .views button { border: 0; background: none; padding: 8px 14px 7px; border-radius: 5px; cursor: pointer;
    font-size: 15px; font-weight: 650; white-space: nowrap; }
  .views button kbd { font: inherit; font-size: 11px; font-weight: 600; color: var(--muted); margin-right: 6px; }
  .views button:hover { background: #e8ebec; }
  .views button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
  .views button[aria-selected="true"] kbd { color: #a9b2bb; }

  .context { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 8px 14px;
    background: var(--paper); border: 1px solid var(--rule); border-radius: 7px; font-size: 14px; }
  .context[hidden] { display: none; }
  .context label { font-weight: 650; }
  .context input[type=range] { width: min(220px, 40vw); accent-color: var(--ink); }
  .context output { font-variant-numeric: tabular-nums; min-width: 3.2ch; color: var(--muted); font-weight: 600; }
  .context .step { width: 30px; height: 30px; border: 1px solid var(--rule); background: #fff; border-radius: 5px;
    cursor: pointer; font-size: 18px; line-height: 1; }
  .context .step:hover { background: #e8ebec; }
  .context .who { min-width: 13ch; text-align: center; }
  .context .who b { display: block; font-size: 17px; font-weight: 780; font-variation-settings: 'wdth' 125; }
  .context .who small { color: var(--muted); }

  /* bottom: group chips on the left, display keys on the right */
  .bottom { position: fixed; bottom: 28px; left: var(--edge); right: var(--edge); display: flex; gap: 16px;
    justify-content: space-between; align-items: flex-end; flex-wrap: wrap; pointer-events: none; }
  .groups { display: grid; grid-template-columns: repeat(var(--n, 8), var(--cell)); grid-auto-rows: var(--cell);
    gap: var(--gap); pointer-events: auto; }
  .cell { position: relative; padding: 0; border: 1.5px dashed var(--rule); border-radius: 4px; background: none;
    display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--muted); cursor: pointer; }
  .cell b { font-size: 17px; font-weight: 780; font-variation-settings: 'wdth' 125; line-height: 1; }
  .cell small { font-size: 11px; margin-top: 4px; font-weight: 500; opacity: .85; white-space: nowrap; }
  .cell.on { border: 0; background: var(--c); color: var(--fg, var(--ink)); }
  .cell:hover { transform: translateY(-2px); }
  .cell[aria-current="true"] { outline: 2.5px solid var(--ink); outline-offset: 3px; }
  .cell.fresh::before { content: ''; position: absolute; top: -4px; right: -4px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--ink); border: 2px solid var(--ground); }
  .cell.pulse::after { content: ''; position: absolute; inset: -5px; border: 2.5px solid var(--ink); border-radius: 7px;
    animation: ring 1.6s ease-out 2 forwards; }
  @keyframes ring { 0% { transform: scale(1.18); opacity: 0; } 35% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

  .left { display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
  .credits { display: flex; align-items: center; gap: 12px; color: var(--ink); pointer-events: auto; }
  .credits img { display: block; height: 28px; width: auto; }
  .credits .wordmark { font-weight: 780; font-variation-settings: 'wdth' 125; font-size: 15px; letter-spacing: .02em; }
  .credits .x { color: var(--muted); }

  /* statistics card for a clicked cube */
  .card { display: block; width: min(340px, 100%); padding: 12px 14px 12px; }
  .card[hidden] { display: none; }
  .card header { display: flex; align-items: center; gap: 9px; }
  .card h2 { margin: 0; flex: 1; font-size: 18px; font-weight: 780; font-variation-settings: 'wdth' 125; }
  .card .chip { width: 14px; height: 14px; border-radius: 3px; background: var(--c); box-shadow: 0 0 0 1px rgba(30,35,42,.2); }
  .card .close { border: 0; background: none; font-size: 22px; line-height: 1; padding: 0 4px; cursor: pointer; color: var(--muted); }
  .card .sub { margin: 3px 0 9px; color: var(--muted); font-size: 13px; }
  .card dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 0; font-size: 14px; line-height: 1.35; }
  .card dt { color: var(--muted); }
  .card dd { margin: 0; font-variant-numeric: tabular-nums; }
  .card dd small { color: var(--muted); }
  .card .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; }
  .card .row span { color: var(--muted); margin-right: 2px; }
  .card .row button { border: 1px solid var(--rule); background: #fff; border-radius: 4px; padding: 4px 9px; cursor: pointer; font-size: 13px; }
  .card .row button:hover { background: #e8ebec; }
  .card .row button:disabled { opacity: .6; cursor: progress; }
  .card .empty { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  .keys { font-size: 13px; color: var(--muted); text-align: right; line-height: 1.7; pointer-events: auto; }
  .keys button { color: var(--ink); background: var(--paper); border: 1px solid var(--rule);
    border-radius: 4px; padding: 3px 9px; margin-left: 6px; cursor: pointer; }
  .keys button:disabled { opacity: .6; cursor: progress; }
  .keys button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .keys kbd { font: inherit; font-weight: 700; }

  /* labels floating in the 3D view */
  .label { opacity: 0; transition: opacity .35s; }
  .label.show { opacity: 1; }
  .hide-labels .label { opacity: 0; }
  .label span { display: block; padding: 5px 9px 4px; border-radius: 4px; background: var(--c); color: var(--fg, var(--ink));
    font: 780 15px/1 'Archivo', sans-serif; font-variation-settings: 'wdth' 125; white-space: nowrap;
    box-shadow: 0 1px 0 rgba(30,35,42,.25); }
  .label.empty span { background: none; color: var(--muted); box-shadow: none; border: 1.5px dashed var(--rule); font-weight: 650; }
  .label.empty span small { font-weight: 500; }
  .label.pulse span { animation: lift 1.6s ease-out 2; }
  @keyframes lift { 0% { transform: translateY(-14px) scale(1.25); } 100% { transform: none; } }

  /* history: step through every published version */
  .history { flex: 1 1 100%; order: -1; display: flex; align-items: center; gap: 8px 10px; padding: 7px 10px;
    background: var(--paper); border: 1px solid var(--rule); border-radius: 7px; pointer-events: auto; font-size: 14px; }
  .history[hidden] { display: none; }
  .step { width: 30px; height: 30px; flex: none; border: 1px solid var(--rule); background: #fff; border-radius: 5px;
    cursor: pointer; font-size: 16px; line-height: 1; padding: 0; }
  .step:hover { background: #e8ebec; }
  .history .track { position: relative; flex: 1; min-width: 120px; height: 30px; }
  .history .ticks { position: absolute; left: 8px; right: 8px; top: 1px; height: 9px; pointer-events: none; }
  .history .ticks i { position: absolute; top: 0; width: 4px; height: 9px; margin-left: -2px; border-radius: 1px;
    background: var(--c); box-shadow: 0 0 0 1px rgba(30,35,42,.18); }
  .history input[type=range] { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; margin: 0; accent-color: var(--ink); }
  .history .when { min-width: 25ch; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .history .when b { font-weight: 700; }
  .history .live { border: 1px solid var(--rule); background: #fff; border-radius: 5px; padding: 5px 10px; cursor: pointer;
    font-weight: 650; white-space: nowrap; }
  .history .live[aria-pressed="true"] { background: #b3261e; border-color: #b3261e; color: #fff; }
  .history .hide { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 0 2px 2px; cursor: pointer; }
  .history .hide:hover { color: var(--ink); }

  /* fullscreen presenting: only the model */
  body.presenting .top, body.presenting .bottom, body.presenting .sheet { display: none !important; }
  body.presenting.idle, body.presenting.idle canvas { cursor: none; }
  .exit-present { position: fixed; top: 16px; right: 16px; z-index: 5; display: none; padding: 7px 12px;
    border: 1px solid var(--rule); border-radius: 5px; background: var(--paper); color: var(--ink);
    font: 600 14px 'Archivo', system-ui, sans-serif; cursor: pointer; opacity: 0; transition: opacity .3s; }
  .exit-present kbd { font: inherit; color: var(--muted); margin-left: 6px; }
  body.presenting .exit-present { display: block; }
  body.presenting .exit-present.show { opacity: 1; }

  /* section planes */
  .sectionpanel { display: grid; grid-template-columns: auto minmax(120px, 200px) auto; gap: 6px 10px; align-items: center; }
  .sectionpanel b { grid-column: 1 / -1; font-weight: 650; }
  .sectionpanel label { font-weight: 650; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .sectionpanel input[type=checkbox] { accent-color: #b3261e; width: 16px; height: 16px; margin: 0; }
  .sectionpanel input[type=range] { width: 100%; accent-color: #b3261e; }
  .sectionpanel .step { width: 28px; height: 26px; font-size: 14px; }

  /* sun */
  .sunpanel { display: grid; grid-template-columns: auto minmax(110px, 190px) 7ch auto; gap: 6px 10px; align-items: center; }
  .sunpanel .step { grid-row: span 2; }
  .sunpanel input[type=range] { width: 100%; }
  .sunpanel output { font-variant-numeric: tabular-nums; color: var(--ink); }
  .sunpanel small { grid-column: 1 / -1; color: var(--muted); }
  .label.compass span { background: none; box-shadow: none; color: var(--ink); padding: 0; font-size: 14px; }

  /* animals' speech bubbles */
  .emote { opacity: 0; transition: opacity .25s; pointer-events: none; }
  .emote.show { opacity: 1; }
  .emote span { display: block; padding: 4px 9px 3px; background: #fff; color: var(--ink); border: 1.5px solid var(--ink);
    border-radius: 10px; font: 700 13px/1.15 'Archivo', system-ui, sans-serif; white-space: nowrap; box-shadow: 0 2px 0 rgba(30,35,42,.2); }

  /* interfaces sheet */
  .sheet { position: fixed; left: var(--edge); right: var(--edge); top: var(--sheet-top, 150px); bottom: var(--sheet-bottom, 120px);
    overflow: auto; background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 18px 22px; }
  .sheet[hidden] { display: none; }
  .sheet header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 6px; }
  .sheet h2 { margin: 0; font-size: 22px; font-weight: 780; font-variation-settings: 'wdth' 125; }
  .sheet .note { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 6px 0 0; max-width: 78ch; }
  .sheet .empty { color: var(--muted); font-size: 15px; margin: 18px 0; }
  .sheet .iface { border-top: 1px solid #e3e6e8; padding: 14px 0 6px; margin-top: 10px; }
  .sheet h3 { margin: 0 0 10px; font-size: 16px; font-weight: 700; }
  .sheet h3 small { color: var(--muted); font-weight: 500; font-size: 14px; }
  .sheet .drawings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .sheet figure { margin: 0; }
  .sheet svg { display: block; width: 100%; height: auto; max-height: 36vh; background: #fbfbfa;
    border: 1px solid #e3e6e8; border-radius: 4px; }
  .sheet svg * { vector-effect: non-scaling-stroke; }
  .sheet figcaption { font-size: 13px; margin-top: 6px; line-height: 1.4; }
  .sheet figcaption span { color: var(--muted); }
  .sheet .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c);
    margin-right: 5px; vertical-align: -1px; box-shadow: 0 0 0 1px rgba(30,35,42,.2); }
  .sheet .print { border: 1px solid var(--rule); background: var(--paper); border-radius: 4px; padding: 5px 12px; cursor: pointer; flex: none; }
  @media print {
    html, body { height: auto; overflow: visible; background: #fff; }
    #view, .top, .bottom { display: none !important; }
    .sheet { position: static; border: 0; padding: 0; overflow: visible; }
    .sheet .print { display: none; }
    .sheet .iface { break-inside: avoid; }
    .sheet svg { max-height: none; }
  }

  @media (max-width: 760px) {
    :root { --cell: 40px; --gap: 5px; --edge: 16px; }
    .sheet .drawings { grid-template-columns: 1fr; }
    .history { flex-wrap: wrap; }
    .history .when { min-width: 0; flex-basis: 100%; order: 9; }
    .top { top: 16px; }
    .title { max-width: none; }
    .controls { align-items: stretch; width: 100%; }
    .views button { flex: 1; padding: 8px 2px 7px; font-size: 13px; }
    .views button kbd, .keys .hint, .cell small { display: none; }
    .bottom { bottom: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .cell.pulse::after, .label.pulse span { animation: none; } }
</style>
<script>
  // Logos live in public/logos/ (mvrdv.svg / ncku.svg, or .png). Until they're there, show the names.
  function logoMissing(img) {
    if (!img.dataset.triedPng) { img.dataset.triedPng = '1'; img.src = img.src.replace(/\.svg$/, '.png'); return; }
    const t = document.createElement('span');
    t.className = 'wordmark';
    t.textContent = img.dataset.name;
    img.replaceWith(t);
  }
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "rhino3dm": "https://cdn.jsdelivr.net/npm/rhino3dm@8.4.0/rhino3dm.module.min.js",
    "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"
  }
}
</script>
</head>
<body>
<div id="view"></div>

<div class="top">
  <header class="title">
    <h1 id="title">Tainan Rocks</h1>
    <p id="status" role="status">Connecting…</p>
  </header>
  <div class="controls">
    <div class="views" role="tablist" aria-label="View">
      <button role="tab" data-view="combined"><kbd>1</kbd>Combined</button>
      <button role="tab" data-view="exploded"><kbd>2</kbd>Exploded</button>
      <button role="tab" data-view="single"><kbd>3</kbd>One by one</button>
      <button role="tab" data-view="matrix"><kbd>4</kbd>Matrix</button>
      <button role="tab" data-view="interfaces"><kbd>5</kbd>Interfaces</button>
    </div>
    <div class="context" id="ctx-exploded" hidden>
      <label for="separation">Separation</label>
      <input id="separation" type="range" min="0" max="3" step="0.05" value="1">
      <output id="separation-value" for="separation">1.0×</output>
    </div>
    <div class="context" id="ctx-single" hidden>
      <button class="step" id="prev" aria-label="Previous group" title="Previous group (←)">‹</button>
      <div class="who" aria-live="polite"><b id="single-name">Group 1</b><small id="single-time"></small></div>
      <button class="step" id="next" aria-label="Next group" title="Next group (→)">›</button>
    </div>
    <section class="context card" id="card" hidden aria-live="polite"></section>
    <div class="context sectionpanel" id="ctx-section" hidden>
      <b>Section</b>
      <label><input type="checkbox" id="cut-0"> X</label>
      <input type="range" id="cut-0-at" min="0" max="1000" step="1" value="500" aria-label="Position of the X plane">
      <button class="step" id="cut-0-flip" type="button" aria-label="Keep the other side of the X plane" title="Keep the other side">⇄</button>
      <label><input type="checkbox" id="cut-1"> Y</label>
      <input type="range" id="cut-1-at" min="0" max="1000" step="1" value="500" aria-label="Position of the Y plane">
      <button class="step" id="cut-1-flip" type="button" aria-label="Keep the other side of the Y plane" title="Keep the other side">⇄</button>
      <label><input type="checkbox" id="cut-2"> Z</label>
      <input type="range" id="cut-2-at" min="0" max="1000" step="1" value="500" aria-label="Position of the Z plane">
      <button class="step" id="cut-2-flip" type="button" aria-label="Keep the other side of the Z plane" title="Keep the other side">⇄</button>
    </div>
    <div class="context sunpanel" id="ctx-sun" hidden>
      <label for="sun-day">Date</label>
      <input id="sun-day" type="range" min="1" max="365" step="1">
      <output id="sun-day-out" for="sun-day"></output>
      <button class="step" id="sun-play" aria-label="Play the day" title="Play the day">▶</button>
      <label for="sun-time">Time</label>
      <input id="sun-time" type="range" min="0" max="1439" step="5">
      <output id="sun-time-out" for="sun-time"></output>
      <small id="sun-info"></small>
    </div>
  </div>
</div>

<div class="bottom">
  <div class="history" id="history" hidden>
    <button class="step" id="hist-prev" aria-label="Previous update" title="Previous update ([)">‹</button>
    <button class="step" id="hist-play" aria-label="Replay every update from the start" title="Replay every update from the start">▶</button>
    <div class="track">
      <div class="ticks" id="hist-ticks"></div>
      <input id="hist-range" type="range" min="0" max="0" step="1" aria-label="Update history">
    </div>
    <button class="step" id="hist-next" aria-label="Next update" title="Next update (])">›</button>
    <div class="when" id="hist-when" aria-live="polite"></div>
    <button class="live" id="hist-live" aria-pressed="true" title="Show the newest version of every group and follow new updates">● Live</button>
    <button class="hide" id="hist-hide" type="button" aria-label="Hide the history bar" title="Hide the history bar (H)">×</button>
  </div>
  <div class="left">
    <nav class="groups" id="groups" aria-label="Groups: click one to view it on its own"></nav>
    <div class="credits" aria-label="Workshop by MVRDV and National Cheng Kung University, Tainan">
      <img src="logos/mvrdv.svg" alt="MVRDV" data-name="MVRDV" onerror="logoMissing(this)">
      <span class="x" aria-hidden="true">×</span>
      <img src="logos/ncku.svg" alt="National Cheng Kung University, Tainan" data-name="NCKU Tainan" onerror="logoMissing(this)">
    </div>
  </div>
  <div class="keys">
    <span class="hint">Drag to orbit, scroll to zoom, click a cube for its details</span><br>
    <button id="btn-update" title="Load the newest models now, without waiting for the cache (U)"><kbd>U</kbd> <span>Update</span></button>
    <button id="btn-rotate" aria-pressed="true" title="Slowly orbit the model (R)"><kbd>R</kbd> Rotate</button>
    <button id="btn-sun" aria-pressed="false" title="Sunlight for a date and time (S)"><kbd>S</kbd> Sun</button>
    <button id="btn-animals" aria-pressed="false" title="Taiwanese animals living on the cubes (A)"><kbd>A</kbd> Animals</button>
    <button id="btn-color" title="Switch colors: groups, model, white (C)"><kbd>C</kbd> <span id="color-name">Group colors</span></button>
    <button id="btn-rock" aria-pressed="false" title="Show the cubes in stone (T)"><kbd>T</kbd> Rock</button>
    <button id="btn-section" aria-pressed="false" title="Cut the model with planes along X, Y and Z (X)"><kbd>X</kbd> Section</button>
    <button id="btn-labels" aria-pressed="true" title="Show group labels (L)"><kbd>L</kbd> Labels</button>
    <button id="btn-history" aria-pressed="true" title="Show or hide the history bar (H)"><kbd>H</kbd> History</button>
    <button id="btn-fit" title="Frame the view (F)"><kbd>F</kbd> Fit</button>
    <button id="btn-present" title="Fullscreen with only the model; Esc to come back (P)"><kbd>P</kbd> Fullscreen</button>
  </div>
</div>

<section class="sheet" id="sheet" hidden></section>
<button class="exit-present" id="exit-present" type="button">Exit fullscreen<kbd>Esc</kbd></button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import rhino3dm from 'rhino3dm';

// ---------- settings (URL parameters, e.g. ?title=Studio%20B&groups=8&explode=1.5&view=matrix&poll=5)
const params = new URLSearchParams(location.search);
const TITLE = params.get('title') || 'Tainan Rocks';
const POLL_MS = Math.max(3, Number(params.get('poll')) || 5) * 1000;
const GROUPS = Math.max(1, Math.min(24, Math.round(Number(params.get('groups'))) || 8));
const STATE_URL = params.get('api') || '/api/state';
const FRESH_MS = 90 * 1000;
const VIEWS = ['combined', 'exploded', 'single', 'matrix', 'interfaces'];
const num = (k, d) => (params.has(k) && Number.isFinite(Number(params.get(k))) ? Number(params.get(k)) : d);
// Sun: Tainan by default. ?lat=&lon=&tz=&place= for elsewhere; ?north= (degrees, counter-clockwise)
// if north in the Rhino model isn't +Y; ?sun=1&day=172&time=15:00 to start with the sun on.
const LAT = num('lat', 22.99), LON = num('lon', 120.21), TZ = num('tz', 8), NORTH = num('north', 0);
const PLACE = params.get('place') || (params.has('lat') ? '' : 'Tainan');

document.getElementById('title').textContent = TITLE;
document.title = TITLE;

// Group colours: one warm-to-cool family at similar strength (vermilion, marigold, leaf, jade, blue,
// violet, rose, earth), checked to be clearly apart (CIEDE2000 ≥ 21 between any two). Every chip and
// label also shows the group's number. Further groups get distinct inks.
const GROUP_COLORS = ['#e05a3a', '#f2b134', '#7fb04b', '#2a9d8f', '#3a78c2', '#6a4c9c', '#d9779f', '#8d6e4e'];
const EXTRA_COLORS = ['#ff48b0', '#0078bf', '#ff6c2f', '#765ba7', '#00838a', '#ffb511', '#62a8e5', '#bb8b41'];
const WHITE = '#f6f7f5';

// Published IDs "3", "G3", "GROUP3", "Group-3" all mean group 3.
function groupNumber(id) {
  const m = /^(?:GROUP|GRP|G)?[-_]?(\d{1,3})$/.exec(id);
  return m ? Number(m[1]) : null;
}
function groupColor(key) {
  const n = groupNumber(key);
  if (n && n <= GROUP_COLORS.length) return GROUP_COLORS[n - 1];
  if (n) return EXTRA_COLORS[(n - 1) % EXTRA_COLORS.length];
  let h = 0; for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return EXTRA_COLORS[h % EXTRA_COLORS.length];
}
function textOn(color) {
  const c = new THREE.Color(color);
  return 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b > 0.18 ? '#1e232a' : '#ffffff';
}

// ---------- state
let view = VIEWS.includes(params.get('view')) ? params.get('view') : 'combined';
let selected = '1';          // slot key shown in "One by one"
let explode = params.has('explode') ? Math.max(0, Math.min(3, Number(params.get('explode')) || 0)) : 1;
{
  const [v, g] = location.hash.slice(1).split('-');
  if (VIEWS.includes(v)) view = v;
  if (g) selected = decodeURIComponent(g);
}
const blocks = {};           // id -> { url, raw, holder, box, center, size, modelColor, publishedAt }
let slotList = [];           // [{ key, id, short, name }]

// ---------- 3D scene (Rhino is Z-up)
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
const viewEl = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.localClippingEnabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
viewEl.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
viewEl.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#dde2e6');
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 20000);
camera.up.set(0, 0, 1);
camera.position.set(-12.4, -19, 17); // same direction as DEFAULT_DIR below
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotateSpeed = 0.35;
controls.maxPolarAngle = Math.PI;   // all the way round, to see the bottom too

const hemi = new THREE.HemisphereLight('#ffffff', '#b9c0c8', 1.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffffff', 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.receiveShadow = true;
scene.add(ground);

// Section planes (X key): always three, parked far away when off, so switching never recompiles shaders.
const cutPlanes = [0, 1, 2].map(() => new THREE.Plane(new THREE.Vector3(0, 0, 1), 1e9));
const sectionUniform = { value: 0 };
const edgeMat = new THREE.LineBasicMaterial({ color: '#1e232a', transparent: true, opacity: 0.55, clippingPlanes: cutPlanes });
const curveMat = new THREE.LineBasicMaterial({ color: '#1e232a', transparent: true, opacity: 0.75, clippingPlanes: cutPlanes });
// Matrix tiles fade in and out with the view.
const tileMat = new THREE.MeshLambertMaterial({ color: '#eef0f1', transparent: true, opacity: 0, depthWrite: false });
const dashMat = new THREE.LineDashedMaterial({ color: '#8f99a3', transparent: true, opacity: 0 });
const decor = new THREE.Group();
scene.add(decor);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
resize();

// ---------- colour modes
const MODES = ['groups', 'model', 'white'];
const MODE_NAMES = { model: 'Model colors', groups: 'Group colors', white: 'White model' };
let mode = MODES.includes(params.get('colors')) ? params.get('colors') : 'groups';
let rockOn = params.get('rock') === '1';
const STONE = new THREE.Color('#b8ad9c');
function colorFor(id, modelColor) {
  if (mode === 'white') return WHITE;
  if (mode === 'model' && modelColor) return modelColor;
  return groupColor(id);
}
// What the model's surfaces get: the colour above, or with Rock on, stone tinted with it.
function surfaceColor(id, modelColor) {
  const c = new THREE.Color(colorFor(id, modelColor));
  return rockOn ? c.lerp(STONE, mode === 'white' ? 0.85 : 0.55) : c;
}
// Colour of a group's chip and label: its model's colour, or the group colour.
function chipColor(slot) {
  const b = slot.id && blocks[slot.id];
  if (!b || mode === 'white') return groupColor(slot.key);
  return colorFor(slot.id, b.modelColor);
}
function recolor() {
  for (const [id, b] of Object.entries(blocks)) paint(id, b.raw);
  document.getElementById('color-name').textContent = MODE_NAMES[mode];
  layout();
  renderGroups();
  renderHistory(true);
  renderInterfaces();
  renderCard();
}

// ---------- loading .3dm files
const rhinoReady = rhino3dm();
const jsonLoader = new THREE.BufferGeometryLoader();
const UNIT_TO_M = { 1: 1e-6, 2: 0.001, 3: 0.01, 4: 1, 5: 1000, 8: 0.0254, 9: 0.3048, 10: 1609.344 };
const enumValue = (e) => (e && e.value !== undefined ? e.value : e);
const rgb = (c) => `rgb(${c.r},${c.g},${c.b})`;

// The colour the object shows in Rhino: object colour, material colour, or layer colour.
function modelColorOf(doc, attrs) {
  try {
    const src = enumValue(attrs.colorSource);
    if (src === 1) return rgb(attrs.objectColor);
    if (src === 2 && attrs.materialIndex >= 0) {
      const m = doc.materials().get(attrs.materialIndex);
      if (m) { const c = m.diffuseColor; m.delete?.(); return rgb(c); }
    }
    const layer = doc.layers().get(attrs.layerIndex);
    if (layer) {
      const c = layer.color; layer.delete?.();
      if (c && (c.r || c.g || c.b)) return rgb(c); // Rhino's default black layer counts as "no colour"
    }
  } catch { /* use the group colour */ }
  return null;
}

async function buildGroup(id, url) {
  const rhino = await rhinoReady;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status} loading ${id}`);
  const doc = rhino.File3dm.fromByteArray(new Uint8Array(await res.arrayBuffer()));
  const scale = UNIT_TO_M[enumValue(doc.settings().modelUnitSystem)] ?? 1;
  const group = new THREE.Group();
  let firstColor;

  function addMesh(rmesh, modelColor) {
    const g = jsonLoader.parse(rmesh.toThreejsJSON());
    if (!g.attributes.normal) g.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ color: surfaceColor(id, modelColor), roughness: 0.92, metalness: 0,
      side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    mat.clippingPlanes = cutPlanes;
    rockify(mat, scale);
    const mesh = new THREE.Mesh(g, mat);
    mesh.castShadow = mesh.receiveShadow = true;
    mesh.userData.modelColor = modelColor;
    mesh.userData.blockId = id;
    group.add(mesh);
    group.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 28), edgeMat));
    if (firstColor === undefined) firstColor = modelColor;
  }

  const objects = doc.objects();
  for (let i = 0; i < objects.count; i++) {
    const obj = objects.get(i);
    const geo = obj.geometry();
    const attrs = obj.attributes();
    const modelColor = modelColorOf(doc, attrs);
    const type = geo.objectType;
    try {
      if (type === rhino.ObjectType.Mesh) {
        addMesh(geo, modelColor);
      } else if (type === rhino.ObjectType.Extrusion) {
        const m = geo.getMesh(rhino.MeshType.Any); // only there if Rhino saved render meshes
        if (m) addMesh(m, modelColor);
      } else if (type === rhino.ObjectType.Brep) {
        const faces = geo.faces();
        for (let f = 0; f < faces.count; f++) { const m = faces.get(f).getMesh(rhino.MeshType.Any); if (m) addMesh(m, modelColor); }
      } else if (type === rhino.ObjectType.Curve) {
        const pts = [];
        if (typeof geo.point === 'function' && geo.pointCount > 1) {
          for (let k = 0; k < geo.pointCount; k++) { const p = geo.point(k); pts.push(new THREE.Vector3(p[0], p[1], p[2])); }
        } else {
          const [t0, t1] = geo.domain;
          for (let k = 0; k <= 96; k++) { const p = geo.pointAt(t0 + (t1 - t0) * k / 96); pts.push(new THREE.Vector3(p[0], p[1], p[2])); }
        }
        group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), curveMat));
      }
    } catch (err) {
      console.warn(`Skipped an object in ${id}:`, err);
    }
    geo.delete?.(); attrs.delete?.(); obj.delete?.();
  }
  doc.delete?.();
  group.scale.setScalar(scale);
  group.updateMatrixWorld(true);
  return { raw: group, modelColor: firstColor ?? null };
}

// ---------- versions
// Every published version of every group, as the server lists them (oldest first). Each model is
// loaded once per URL and kept, so stepping back and forth through history is instant.
const groupVersions = {};   // id -> [{ url, size, publishedAt }]
const modelCache = {};      // url -> Promise<{ raw, box, center, size, modelColor }>
function loadModel(id, url) {
  if (!modelCache[url]) {
    const p = buildGroup(id, url).then(({ raw, modelColor }) => {
      const box = new THREE.Box3().setFromObject(raw);
      const center = box.isEmpty() ? new THREE.Vector3() : box.getCenter(new THREE.Vector3());
      const size = box.isEmpty() ? new THREE.Vector3() : box.getSize(new THREE.Vector3());
      raw.position.copy(center).negate();   // hang the model around its centre inside the holder
      return { raw, box, center, size, modelColor };
    });
    p.catch(() => { if (modelCache[url] === p) delete modelCache[url]; });
    modelCache[url] = p;
  }
  return modelCache[url];
}
function disposeModel(url) {
  const p = modelCache[url];
  delete modelCache[url];
  p?.then((m) => m.raw.traverse((o) => {
    o.geometry?.dispose();
    if (o.material && o.material !== edgeMat && o.material !== curveMat) o.material.dispose();
  }), () => {});
}
function paint(id, raw) {
  raw.traverse((o) => { if (o.isMesh) o.material.color.copy(surfaceColor(id, o.userData.modelColor)); });
}

// Each group on screen hangs its current model in a holder placed at the model's centre, so the
// views can move and scale every piece around its own centre.
function showModel(id, m, idx) {
  let b = blocks[id];
  if (!b) {
    const holder = new THREE.Group();
    holder.scale.setScalar(0.001);   // grows in
    holder.userData = { target: new THREE.Vector3(), scale: 1, snap: true };
    scene.add(holder);
    b = blocks[id] = { holder };
  }
  if (b.raw !== m.raw) {
    if (b.raw) b.holder.remove(b.raw);
    paint(id, m.raw);
    b.holder.add(m.raw);
  }
  const v = groupVersions[id][idx];
  Object.assign(b, { url: v.url, publishedAt: v.publishedAt, version: idx, versionCount: groupVersions[id].length,
    raw: m.raw, box: m.box, center: m.center, size: m.size, modelColor: m.modelColor });
}
function hideBlock(id) {
  const b = blocks[id];
  if (!b) return;
  if (b.raw) b.holder.remove(b.raw);
  scene.remove(b.holder);
  delete blocks[id];
}

// ---------- history: which version each group shows
let historyAt = null;       // null = live (newest of everything); otherwise a time in ms
const versionTime = (v) => Date.parse(v.publishedAt) || 0;
function versionIndexAt(id, t) {
  const vs = groupVersions[id];
  if (t === null) return vs.length - 1;
  let idx = -1;
  for (let i = 0; i < vs.length; i++) if (versionTime(vs[i]) <= t) idx = i;
  return idx;
}
// Every update in order: [{ id, idx, at }]
function allUpdates() {
  const list = [];
  for (const [id, vs] of Object.entries(groupVersions)) vs.forEach((v, idx) => list.push({ id, idx, at: versionTime(v) }));
  return list.sort((a, b) => a.at - b.at || (a.id < b.id ? -1 : 1));
}

// Bring the scene in line with groupVersions and the history position. Resolves to true if anything changed.
let syncToken = 0;
async function sync() {
  const token = ++syncToken;
  const wanted = {};
  for (const id of Object.keys(groupVersions)) {
    const idx = versionIndexAt(id, historyAt);
    if (idx >= 0) wanted[id] = idx;
  }
  const loaded = await Promise.all(Object.entries(wanted).map(([id, idx]) =>
    loadModel(id, groupVersions[id][idx].url).then((m) => ({ id, idx, m }),
      (err) => { console.warn(`Could not load ${id} version ${idx + 1}:`, err); return null; })));
  if (token !== syncToken) return false;   // a newer request (more scrubbing) takes over
  let changed = false;
  for (const id of Object.keys(blocks)) if (!(id in wanted)) { hideBlock(id); changed = true; }
  for (const r of loaded) {
    if (!r) continue;
    const b = blocks[r.id];
    if (!b || b.raw !== r.m.raw || b.version !== r.idx || b.versionCount !== groupVersions[r.id].length) {
      showModel(r.id, r.m, r.idx);
      changed = true;
    }
  }
  return changed;
}

// Re-lay out everything after the set of models on screen changed.
function refreshScene(refit = false) {
  const before = currentBounds.getSize(new THREE.Vector3()).length();
  const box = layout();
  if (refit || Math.abs(box.getSize(new THREE.Vector3()).length() - before) / before > 0.15) frame(box);
  renderGroups();
  renderStatus();
  renderHistory();
  renderInterfaces();
  renderCard();
}

// ---------- slots: Group 1..N, plus any other published IDs
function computeSlots() {
  const byNumber = {};
  for (const [id, b] of Object.entries(blocks)) {
    const n = groupNumber(id);
    if (n && n >= 1 && n <= GROUPS && (!byNumber[n] || new Date(b.publishedAt) > new Date(blocks[byNumber[n]].publishedAt))) byNumber[n] = id;
  }
  const list = [];
  for (let n = 1; n <= GROUPS; n++) list.push({ key: String(n), id: byNumber[n] || null, short: String(n), name: `Group ${n}` });
  for (const id of Object.keys(blocks).sort()) {
    const n = groupNumber(id);
    if (n && n >= 1 && n <= GROUPS) continue;
    list.push({ key: id, id, short: n ? String(n) : id, name: n ? `Group ${n}` : id });
  }
  return list;
}

// ---------- labels (one per slot, floating in the 3D view)
const labels = {};  // key -> CSS2DObject
function labelFor(slot) {
  let l = labels[slot.key];
  if (!l) {
    const el = document.createElement('div');
    el.className = 'label';
    el.appendChild(document.createElement('span'));
    l = new CSS2DObject(el);
    l.userData.target = new THREE.Vector3();
    scene.add(l);
    labels[slot.key] = l;
  }
  return l;
}

// ---------- layout: where every piece goes in the current view
let nominal = 3;        // size of one piece before anything is published
let currentBounds = new THREE.Box3(new THREE.Vector3(-3, -3, 0), new THREE.Vector3(3, 3, 3));

function layout() {
  slotList = computeSlots();
  if (!slotList.some((s) => s.key === selected)) selected = (slotList.find((s) => s.id) || slotList[0]).key;
  const placed = slotList.filter((s) => s.id && !blocks[s.id].box.isEmpty());

  let piece = 0;
  for (const s of placed) { const z = blocks[s.id].size; piece = Math.max(piece, z.x, z.y); }
  if (piece > 0) nominal = piece;

  // Combined: real Rhino positions, centred on the origin, standing on the ground.
  const combined = new THREE.Box3();
  for (const s of placed) combined.union(blocks[s.id].box);
  const cc = combined.isEmpty() ? new THREE.Vector3() : combined.getCenter(new THREE.Vector3());
  const base = new THREE.Vector3(cc.x, cc.y, combined.isEmpty() ? 0 : combined.min.z);
  // Exploded: push each piece away from the centre by `explode` × its distance, then put the lowest back on the ground.
  let lift = 0;
  if (placed.length) {
    lift = Infinity;
    for (const s of placed) {
      const b = blocks[s.id];
      lift = Math.min(lift, b.center.z - base.z - b.size.z / 2 + (b.center.z - cc.z) * explode);
    }
    lift = -lift;
  }
  // Matrix: a grid of cells, reading left to right, back to front.
  const n = slotList.length;
  const portrait = camera.aspect < 1;
  const cols = portrait ? Math.min(n, 2) : n <= 4 ? n : n <= 10 ? Math.ceil(n / 2) : Math.ceil(Math.sqrt(n * 1.6));
  const rows = Math.ceil(n / cols);
  const C = nominal * 2.1;
  const cell = (i) => new THREE.Vector3((i % cols - (cols - 1) / 2) * C, ((rows - 1) / 2 - Math.floor(i / cols)) * C, 0);

  const bounds = new THREE.Box3();
  slotList.forEach((s, i) => {
    const b = s.id && blocks[s.id];
    const label = labelFor(s);
    const c = cell(i);
    let show = false;
    if (b && !b.box.isEmpty()) {
      const half = b.size.z / 2;
      const inCombined = b.center.clone().sub(base);
      let target = inCombined, scale = 1;
      if (view === 'exploded') { target = inCombined.clone().addScaledVector(b.center.clone().sub(cc), explode); target.z += lift; }
      else if (view === 'matrix') target = c.clone().setZ(half);
      else if (view === 'single' || view === 'interfaces') { if (s.key === selected) target = new THREE.Vector3(0, 0, half); else scale = 0; }
      const h = b.holder.userData;
      h.target.copy(target); h.scale = scale;
      if (h.snap) { b.holder.position.copy(target); h.snap = false; }
      if (scale) bounds.union(new THREE.Box3().setFromCenterAndSize(target, b.size));
      if (view === 'exploded') { label.userData.target.copy(target).setZ(target.z + half + nominal * 0.08); label.center.set(0.5, 1); show = true; }
    }
    if (view === 'matrix') { label.userData.target.copy(c).setY(c.y - C * 0.4); label.center.set(0.5, -0.25); show = true; }
    if (!label.userData.placed) { label.position.copy(label.userData.target); label.userData.placed = true; }
    const el = label.element;
    el.classList.toggle('show', show);
    el.classList.toggle('empty', !b);
    el.style.setProperty('--c', chipColor(s));
    el.style.setProperty('--fg', textOn(chipColor(s)));
    el.firstChild.innerHTML = '';
    el.firstChild.append(view === 'matrix' ? s.name : s.short);
    if (view === 'matrix' && !b) el.firstChild.append(Object.assign(document.createElement('small'), { textContent: ' · waiting' }));
  });
  for (const key of Object.keys(labels)) {
    if (!slotList.some((s) => s.key === key)) { scene.remove(labels[key]); labels[key].element.remove(); delete labels[key]; }
  }

  // Matrix tiles: solid for published groups, dashed outline for the rest.
  decor.traverse((o) => o.geometry?.dispose());
  decor.clear();
  const tile = C * 0.8, z = nominal * 0.002;
  slotList.forEach((s, i) => {
    const c = cell(i);
    if (s.id) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(tile, tile), tileMat);
      m.position.set(c.x, c.y, z);
      m.receiveShadow = true;
      decor.add(m);
    } else {
      const h = tile / 2;
      const pts = [[-h, -h], [h, -h], [h, h], [-h, h], [-h, -h]].map(([x, y]) => new THREE.Vector3(c.x + x, c.y + y, z));
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), dashMat);
      line.computeLineDistances();
      decor.add(line);
    }
  });
  dashMat.dashSize = dashMat.gapSize = C * 0.04;
  const grid = new THREE.Box3(new THREE.Vector3(-cols * C / 2, -rows * C / 2 - C * 0.25, 0), new THREE.Vector3(cols * C / 2, rows * C / 2, nominal));
  if (view === 'matrix') bounds.union(grid);
  if (bounds.isEmpty()) bounds.setFromCenterAndSize(new THREE.Vector3(0, 0, nominal / 2), new THREE.Vector3(nominal, nominal, nominal).multiplyScalar(2));

  fitShadows(bounds.clone().union(grid));
  currentBounds = bounds;
  updateCuts();
  updateSunPath();
  renderContext();
  return bounds;
}

// ---------- camera: glide to frame the view, keeping the direction the viewer chose
let camGoal = null;
const DEFAULT_DIR = new THREE.Vector3(-0.62, -0.95, 0.85).normalize();
const MATRIX_DIR = new THREE.Vector3(0, -0.5, 1).normalize();
// Distance at which all 8 corners of `box` fit in the view (with room for the controls), looking along the current direction.
function frame(box = currentBounds, dir = camGoal?.dir || camera.position.clone().sub(controls.target).normalize()) {
  const c = box.getCenter(new THREE.Vector3());
  const right = new THREE.Vector3().crossVectors(dir.clone().negate(), camera.up);
  if (right.lengthSq() < 1e-8) right.set(1, 0, 0);   // looking straight up or down
  right.normalize();
  const up = new THREE.Vector3().crossVectors(right, dir.clone().negate());
  const margin = presenting ? 0.85 : camera.aspect < 1 ? 0.7 : 0.6;   // fill more of the screen without controls
  const ty = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * margin;
  const tx = ty * camera.aspect;
  let dist = 0;
  for (let i = 0; i < 8; i++) {
    const v = new THREE.Vector3(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).sub(c);
    const d = v.dot(dir);
    dist = Math.max(dist, d + Math.abs(v.dot(up)) / ty, d + Math.abs(v.dot(right)) / tx);
  }
  camGoal = { target: c, dist: Math.max(dist, 0.1), dir: dir.clone() };
}
const STUDIO_DIR = new THREE.Vector3(-0.55, -0.75, 1.05).normalize();
const lightDir = STUDIO_DIR.clone();
let lightAlt = Math.PI / 4;           // the light's height above the horizon
let shadowBox = currentBounds.clone();
function fitShadows(box) {
  shadowBox = box.clone();
  const c = box.getCenter(new THREE.Vector3());
  const r = Math.max(box.getSize(new THREE.Vector3()).length() / 2, 1);
  const low = Math.max(Math.sin(lightAlt), 0.06);   // a low sun casts long shadows
  sun.target.position.copy(c);

  try {
    const res = await fetch(stateUrl(fresh), { cache: 'no-store' });

    for (const url of stale) if (!Object.values(blocks).some((b) => b.url === url)) disposeModel(url);

    polling = false;

  const R = Math.max(currentBounds.getSize(new THREE.Vector3()).length() * 0.62, nominal * 1.2);
  const key = `${sunDay}|${R.toFixed(3)}|${c.x.toFixed(3)}|${c.y.toFixed(3)}`;
  if (key !== sunPathKey) {

    for (const o of [...sunGroup.children]) if (o !== sunBall) { o.geometry.dispose(); sunGroup.remove(o); }

// ---------- interfaces: 2D drawings of the faces where a group's cube touches another cube
const sheetEl = document.getElementById('sheet');
const SIDE_NAMES = [['west', 'east'], ['south', 'north'], ['bottom', 'top']];
const AXIS = ['x', 'y', 'z'];
const fmtLen = (m) => (Math.abs(m) >= 1 ? `${m.toFixed(2)} m` : `${(m * 100).toFixed(1)} cm`);
const fmtArea = (a) => (a >= 0.1 ? `${a.toFixed(2)} m²` : `${(a * 1e4).toFixed(0)} cm²`);

// Other cubes sitting against this one: they share a face plane (within 3% of a cube's size)
// and overlap across it. A 2×2×2 arrangement gives every cube three.
function contacts(id) {
  const g = blocks[id];
  if (!g || !g.box || g.box.isEmpty()) return [];
  const tol = nominal * 0.03, minOverlap = nominal * 0.1;
  const out = [];
  for (const [hid, h] of Object.entries(blocks)) {
    if (hid === id || !h.box || h.box.isEmpty()) continue;
    for (let a = 0; a < 3; a++) {
      const across = [(a + 1) % 3, (a + 2) % 3].every((k) =>
        Math.min(g.box.max.getComponent(k), h.box.max.getComponent(k)) - Math.max(g.box.min.getComponent(k), h.box.min.getComponent(k)) >= minOverlap);
      if (!across) continue;
      const above = h.box.min.getComponent(a) - g.box.max.getComponent(a);
      const below = g.box.min.getComponent(a) - h.box.max.getComponent(a);
      if (Math.abs(above) < tol) out.push({ hid, a, side: 1, plane: g.box.max.getComponent(a) + above / 2, gap: above });
      else if (Math.abs(below) < tol) out.push({ hid, a, side: 0, plane: g.box.min.getComponent(a) - below / 2, gap: below });
    }
  }
  return out.sort((p, q) => p.a - q.a || p.side - q.side);
}

// Everything of a model that lies in the plane (filled), plus all its edges (those in the plane bold).
function flatten(b, a, plane, tol, right, up) {
  const s = b.raw.scale.x;   // model units → metres, the same space as b.box
  const fills = [], edges = [];
  let area = 0;
  const p = new THREE.Vector3(), q = new THREE.Vector3(), r = new THREE.Vector3();
  const uv = (v) => [v.dot(right), v.dot(up)];
  const near = (v) => Math.abs(v.getComponent(a) - plane) < tol;
  b.raw.traverse((o) => {
    const pos = o.geometry?.attributes?.position;
    if (!pos) return;
    if (o.isMesh) {
      const index = o.geometry.index;
      const n = index ? index.count : pos.count;
      const at = (i) => (index ? index.getX(i) : i);
      for (let i = 0; i + 2 < n; i += 3) {
        p.fromBufferAttribute(pos, at(i)).multiplyScalar(s);
        q.fromBufferAttribute(pos, at(i + 1)).multiplyScalar(s);
        r.fromBufferAttribute(pos, at(i + 2)).multiplyScalar(s);
        if (!(near(p) && near(q) && near(r))) continue;
        const t = [uv(p), uv(q), uv(r)];
        fills.push(t);
        area += Math.abs((t[1][0] - t[0][0]) * (t[2][1] - t[0][1]) - (t[2][0] - t[0][0]) * (t[1][1] - t[0][1])) / 2;
      }
    } else if (o.isLineSegments) {
      for (let i = 0; i + 1 < pos.count; i += 2) {
        p.fromBufferAttribute(pos, i).multiplyScalar(s);
        q.fromBufferAttribute(pos, i + 1).multiplyScalar(s);
        edges.push([...uv(p), ...uv(q), near(p) && near(q)]);
      }
    }
  });
  return { fills, edges, area };
}
// The rectangle a box covers in the drawing.
function faceRect(box, right, up) {
  let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
  for (let i = 0; i < 8; i++) {
    const c = new THREE.Vector3(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z);
    const u = c.dot(right), v = c.dot(up);
    u0 = Math.min(u0, u); u1 = Math.max(u1, u); v0 = Math.min(v0, v); v1 = Math.max(v1, v);
  }
  return [u0, v0, u1, v1];
}
function svgDrawing(frame, layers, title) {
  const [u0, v0, u1, v1] = frame;
  const f = (n) => +n.toFixed(5);
  const pt = (u, v) => `${f(u)},${f(-v)}`;
  let out = `<svg viewBox="${f(u0)} ${f(-v1)} ${f(u1 - u0)} ${f(v1 - v0)}" xmlns="http://www.w3.org/2000/svg" role="img"><title>${title}</title>`;
  for (const L of layers) {
    if (L.rect) {
      const [a0, b0, a1, b1] = L.rect;
      out += `<rect x="${f(a0)}" y="${f(-b1)}" width="${f(a1 - a0)}" height="${f(b1 - b0)}" fill="none" stroke="#b9c1c8" stroke-width="1" stroke-dasharray="5 4"/>`;
    }
    if (L.fills && L.fills.length) {
      out += `<g fill="${L.color}" stroke="${L.color}" stroke-width="0.75" opacity="${L.opacity}" style="mix-blend-mode:multiply">`;
      for (const t of L.fills) out += `<polygon points="${t.map(([u, v]) => pt(u, v)).join(' ')}"/>`;
      out += '</g>';
    }
    if (L.edges) {
      let back = '', front = '';
      for (const [a, b, c, d, on] of L.edges) {
        const seg = `M${pt(a, b)}L${pt(c, d)}`;
        if (on) front += seg; else if (L.back) back += seg;
      }
      if (back) out += `<path d="${back}" fill="none" stroke="#a9b2bb" stroke-width="0.8"/>`;
      if (front) out += `<path d="${front}" fill="none" stroke="${L.ink || '#1e232a'}" stroke-width="1.6" stroke-linecap="round"/>`;
    }
  }
  return out + '</svg>';
}

function placeSheet() {
  const top = document.querySelector('.top').getBoundingClientRect().bottom + 12;
  const bottom = innerHeight - document.querySelector('.bottom').getBoundingClientRect().top + 12;
  sheetEl.style.setProperty('--sheet-top', `${Math.round(top)}px`);
  sheetEl.style.setProperty('--sheet-bottom', `${Math.round(bottom)}px`);
}
function renderInterfaces() {
  if (view !== 'interfaces') return;
  placeSheet();
  const slot = slotList.find((x) => x.key === selected);
  const b = slot && slot.id && blocks[slot.id];
  const when = historyAt === null ? '' : ` at ${clock(historyAt)}`;
  const head = `<header><div><h2>${slot ? slot.name : ''} · interfaces${when}</h2>
    <p class="note">The faces where ${slot ? slot.name : 'this group'}'s cube touches another cube, drawn flat as seen from the neighbour.
    Colour is the surface lying in the shared plane, dark lines its edges, grey lines edges further back.
    The neighbour's face is mirrored so both drawings line up: overlaid, mixed colour is where the two faces meet.</p></div>
    <button class="print" type="button">Print</button></header>`;
  let body = '';
  if (!b) {
    body = `<p class="empty">${slot ? slot.name : 'This group'} hasn't published ${historyAt === null ? 'yet' : 'by then'}.</p>`;
  } else {
    const list = contacts(slot.id);
    if (!list.length) body = `<p class="empty">No other cube touches ${slot.name}${historyAt === null ? ' yet' : ' at that time'}. A face counts once another group's cube sits against it.</p>`;
    for (const c of list) {
      const h = blocks[c.hid];
      const sign = c.side ? 1 : -1;
      const forward = new THREE.Vector3().setComponent(c.a, -sign);            // looking at the face from the neighbour
      const up = c.a === 2 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(0, 0, 1);
      const right = new THREE.Vector3().crossVectors(forward, up);
      const tol = Math.max(nominal * 0.005, Math.abs(c.gap) / 2 + nominal * 0.003);
      const mine = flatten(b, c.a, c.plane, tol, right, up);
      const theirs = flatten(h, c.a, c.plane, tol, right, up);
      const rectG = faceRect(b.box, right, up), rectH = faceRect(h.box, right, up);
      const pad = Math.max(rectG[2] - rectG[0], rectG[3] - rectG[1]) * 0.08;
      const frame = [Math.min(rectG[0], rectH[0]) - pad, Math.min(rectG[1], rectH[1]) - pad,
        Math.max(rectG[2], rectH[2]) + pad, Math.max(rectG[3], rectH[3]) + pad];
      const hSlot = slotList.find((x) => x.id === c.hid);
      const nameG = slot.name, nameH = hSlot ? hSlot.name : c.hid;
      const colG = chipColor(slot), colH = hSlot ? chipColor(hSlot) : groupColor(c.hid);
      const myFace = SIDE_NAMES[c.a][c.side], theirFace = SIDE_NAMES[c.a][1 - c.side];
      const gapNote = Math.abs(c.gap) > nominal * 0.002 ? ` · ${c.gap > 0 ? 'gap' : 'overlap'} ${fmtLen(Math.abs(c.gap))}` : '';
      const size = `${fmtLen(rectG[2] - rectG[0])} × ${fmtLen(rectG[3] - rectG[1])}`;
      body += `<div class="iface">
        <h3>${c.a === 2 ? (c.side ? 'Top' : 'Bottom') : myFace[0].toUpperCase() + myFace.slice(1)} face, against ${nameH}
          <small>· plane ${AXIS[c.a]} = ${fmtLen(c.plane)}${gapNote}</small></h3>
        <div class="drawings">
          <figure>${svgDrawing(frame, [{ rect: rectG }, { fills: mine.fills, color: colG, opacity: 0.9 }, { edges: mine.edges, back: true }], `${nameG}, ${myFace} face`)}
            <figcaption><span class="swatch" style="--c:${colG}"></span><b>${nameG}</b> <span>${myFace} face, ${size} · touching ${fmtArea(mine.area)}</span></figcaption></figure>
          <figure>${svgDrawing(frame, [{ rect: rectH }, { fills: theirs.fills, color: colH, opacity: 0.9 }, { edges: theirs.edges, back: true }], `${nameH}, ${theirFace} face`)}
            <figcaption><span class="swatch" style="--c:${colH}"></span><b>${nameH}</b> <span>${theirFace} face, mirrored to line up · touching ${fmtArea(theirs.area)}</span></figcaption></figure>
          <figure>${svgDrawing(frame, [{ rect: rectG }, { fills: mine.fills, color: colG, opacity: 0.6 }, { fills: theirs.fills, color: colH, opacity: 0.6 },
            { edges: mine.edges }, { edges: theirs.edges, ink: '#5b6470' }], `${nameG} and ${nameH} overlaid`)}
            <figcaption><b>Both overlaid</b> <span>mixed colour = the faces meet; one colour only = that face has nothing to touch there</span></figcaption></figure>
        </div></div>`;
    }
  }
  sheetEl.innerHTML = head + body;
  sheetEl.querySelector('.print').onclick = () => print();
}

function hideCard() { cardFor = null; renderCard(); }
function renderCard() {
  const slot = cardFor && slotList.find((x) => x.key === cardFor);
  highlight(slot && slot.id);
  if (!slot || view === 'interfaces') { cardEl.hidden = true; return; }
  cardEl.hidden = false;
  const b = slot.id && blocks[slot.id];
  const color = chipColor(slot);
  let body;
  if (!b) {
    body = `<p class="empty">${historyAt === null ? 'Not published yet.' : 'Not published yet at this point in the history.'}</p>`;
  } else {
    const st = meshStats(b.raw);
    const boxVol = b.size.x * b.size.y * b.size.z;
    const solidOk = st.volume > 0 && st.volume <= boxVol * 1.02;
    const near = contacts(slot.id);
    let touching = 0;
    for (const c of near) {
      const sign = c.side ? 1 : -1;
      const forward = new THREE.Vector3().setComponent(c.a, -sign);
      const up = c.a === 2 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(0, 0, 1);
      const tol = Math.max(nominal * 0.005, Math.abs(c.gap) / 2 + nominal * 0.003);
      touching += flatten(b, c.a, c.plane, tol, new THREE.Vector3().crossVectors(forward, up), up).area;
    }
    const names = near.map((c) => slotList.find((x) => x.id === c.hid)?.short || c.hid).join(', ');
    const v = groupVersions[slot.id]?.[b.version];
    body = `<dl>
      <dt>Size</dt><dd>${fmtNum(b.size.x)} × ${fmtNum(b.size.y)} × ${fmtNum(b.size.z)} m</dd>
      ${solidOk ? `<dt>Volume</dt><dd>${fmtNum(st.volume, 3)} m³ <small>(${fmtNum(st.volume * 1000, 0)} L)</small></dd>
      <dt>Void</dt><dd>${fmtNum((1 - st.volume / boxVol) * 100, 0)}% <small>of its bounding box</small></dd>
      <dt>In concrete</dt><dd>≈ ${fmtNum(st.volume * CONCRETE_DENSITY, 0)} kg <small>(2.4 t/m³)</small></dd>`
      : `<dt>Volume</dt><dd><small>can't tell: the model isn't one closed solid</small></dd>`}
      <dt>Surface</dt><dd>${fmtNum(st.area)} m²</dd>
      <dt>Touching</dt><dd>${near.length ? `${near.length} ${near.length === 1 ? 'cube' : 'cubes'} <small>(group ${esc(names)})</small>, ${fmtNum(touching)} m²` : '<small>no other cube</small>'}</dd>
      <dt>Model</dt><dd>${fmtNum(st.tris, 0)} triangles${v && v.size ? ` <small>· ${fmtBytes(v.size)} file</small>` : ''}</dd>
    </dl>`;
  }
  const sub = !b ? '' : `${b.versionCount > 1 ? `Version ${b.version + 1} of ${b.versionCount} · ` : ''}published ${historyAt === null ? timeAgo(b.publishedAt) : 'at ' + clock(b.publishedAt)}`;
  cardEl.innerHTML = `<header><span class="chip" style="--c:${esc(color)}"></span><h2>${esc(slot.name)}</h2>
      <button class="close" type="button" aria-label="Close">×</button></header>
    ${sub ? `<p class="sub">${sub}</p>` : ''}${body}
    <div class="row"><button type="button" data-act="single">One by one</button><button type="button" data-act="interfaces">Interfaces</button></div>
    ${b ? `<div class="row"><span>Download .3dm:</span><button type="button" data-act="dl-this">This version</button>
      ${b.versionCount > 1 ? `<button type="button" data-act="dl-versions">All ${b.versionCount} versions</button>` : ''}
      <button type="button" data-act="dl-all">Every group</button></div>` : ''}`;
  cardEl.querySelector('.close').onclick = hideCard;
  cardEl.querySelectorAll('[data-act]').forEach((btn) => {
    btn.onclick = () => {
      const act = btn.dataset.act;
      if (act === 'single' || act === 'interfaces') return setView(act, { group: slot.key });
      download(act, slot, btn);
    };
  });
}
// The clicked cube glows a little.
function highlight(id) {
  for (const [bid, b] of Object.entries(blocks)) {
    b.raw.traverse((o) => {
      if (!o.isMesh) return;
      o.material.emissive.set(bid === id ? '#ffffff' : '#000000');
      o.material.emissiveIntensity = bid === id ? 0.14 : 0;
    });
  }
}

// ---------- downloads: the published .3dm files, named after the group, version and time
const stamp = (t) => {
  const d = new Date(t), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
};
const safe = (t) => String(t).replace(/[^\w.-]+/g, '-').replace(/^-+|-+$/g, '');
const fileName = (slot, idx, v) => `${safe(TITLE)}_${safe(slot.name)}_v${idx + 1}_${stamp(v.publishedAt)}.3dm`;
async function fetchBytes(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status} for ${url}`);
  return new Uint8Array(await res.arrayBuffer());
}
function saveFile(bytes, name, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes], { type }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function download(act, slot, btn) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Preparing…';
  try {
    if (act === 'dl-this') {
      const b = blocks[slot.id], v = groupVersions[slot.id][b.version];
      saveFile(await fetchBytes(v.url), fileName(slot, b.version, v), 'application/octet-stream');
    } else {
      // Several files: one zip (.3dm files are already compressed, so they're stored as they are).
      const files = [];
      if (act === 'dl-versions') groupVersions[slot.id].forEach((v, i) => files.push([fileName(slot, i, v), v.url]));
      else for (const s of slotList) if (s.id && blocks[s.id]) {
        const b = blocks[s.id], v = groupVersions[s.id][b.version];
        files.push([fileName(s, b.version, v), v.url]);
      }
      const { zipSync } = await import('fflate');
      const entries = {};
      for (const [name, url] of files) entries[name] = [await fetchBytes(url), { level: 0 }];
      const what = act === 'dl-versions' ? `${safe(slot.name)}_all-versions` : historyAt === null ? 'all-groups' : `all-groups_as-of_${stamp(historyAt)}`;
      saveFile(zipSync(entries), `${safe(TITLE)}_${what}_${stamp(Date.now())}.zip`, 'application/zip');
    }
  } catch (err) {
    console.warn(err);
    statusNote = { until: Date.now() + 8000, text: `Download failed (${err.message}).` };
    renderStatus();
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

// ---------- animation
function snapCamera() {
  if (!camGoal) return;
  controls.target.copy(camGoal.target);
  camera.position.copy(camGoal.target).addScaledVector(camGoal.dir, camGoal.dist);
  camGoal = null;
}
const timer = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(timer.getDelta(), 0.1);
  const a = 1 - Math.exp(-dt * 7);
  if (animalsOn) updateCritters(dt);
  if (sunOn && sunPlaying) {   // one hour of daylight per second
    sunMinutes += dt * 60;
    if (sunMinutes >= SUN_PLAY[1]) sunMinutes = SUN_PLAY[0];
    applyLight();
  }
  for (const b of Object.values(blocks)) {
    const h = b.holder, u = h.userData;
    h.position.lerp(u.target, a);
    const s = THREE.MathUtils.lerp(h.scale.x, u.scale, a);
    h.scale.setScalar(Math.abs(s - u.scale) < 1e-3 ? u.scale : s);
    h.visible = h.scale.x > 0.002;
  }
  for (const l of Object.values(labels)) l.position.lerp(l.userData.target, a);
  const tileGoal = view === 'matrix' ? 1 : 0;
  tileMat.opacity = THREE.MathUtils.lerp(tileMat.opacity, tileGoal, a);
  dashMat.opacity = THREE.MathUtils.lerp(dashMat.opacity, tileGoal * 0.9, a);
  decor.visible = tileMat.opacity > 0.01;

  if (camGoal) {
    const t = 1 - Math.exp(-dt * 4);
    const offset = camera.position.clone().sub(controls.target);
    const len = THREE.MathUtils.lerp(offset.length(), camGoal.dist, t);
    const dir = offset.normalize().lerp(camGoal.dir, t).normalize();
    controls.target.lerp(camGoal.target, t);
    camera.position.copy(controls.target).addScaledVector(dir, len);
    if (controls.target.distanceTo(camGoal.target) < camGoal.dist * 1e-3 && Math.abs(len - camGoal.dist) < camGoal.dist * 1e-3 &&
        dir.angleTo(camGoal.dir) < 1e-3) camGoal = null;
  }
  const d = camera.position.distanceTo(controls.target);
  camera.near = d / 100; camera.far = d * 30; camera.updateProjectionMatrix();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});

applyLight();
if (rockOn) setRock(true);
document.getElementById('color-name').textContent = MODE_NAMES[mode];
setView(view);
snapCamera();
from = view;
poll();
setInterval(poll, POLL_MS);
setInterval(() => { renderGroups(); renderContext(); renderStatus(); renderHistory(); renderCard(); }, 15000);
</script>
